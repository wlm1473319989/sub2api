name: Deploy Docker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment name used for deployment secrets and approvals'
        required: true
        default: production
        type: string
      image_tag:
        description: 'Image tag to deploy (use latest or a release tag like 1.2.3 / v1.2.3)'
        required: true
        default: latest
        type: string
      compose_file:
        description: 'Compose file on the server, relative to DEPLOY_PATH'
        required: true
        default: docker-compose.local.yml
        type: string
      wait_seconds:
        description: 'How long to wait for the sub2api container health check'
        required: true
        default: '180'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMPOSE_FILE: ${{ github.event.inputs.compose_file }}
          RAW_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          WAIT_SECONDS: ${{ github.event.inputs.wait_seconds }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DEPLOY_PATH,COMPOSE_FILE,RAW_IMAGE_TAG,WAIT_SECONDS,REPOSITORY_OWNER,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_TOTP_ENCRYPTION_KEY
          command_timeout: 30m
          script: |
            set -e

            test -n "$DEPLOY_PATH"
            test -d "$DEPLOY_PATH"

            cd "$DEPLOY_PATH"
            test -f "$COMPOSE_FILE"

            if [ ! -f .env ]; then
              echo "Missing $DEPLOY_PATH/.env; deployment secrets must be persisted on the server."
              exit 1
            fi

            is_valid_encryption_key() {
              key="$1"
              [ "${#key}" -eq 64 ] || return 1
              case "$key" in
                *[!0-9a-fA-F]*) return 1 ;;
              esac
            }

            incoming_totp_key="${DEPLOY_TOTP_ENCRYPTION_KEY:-}"
            if [ -n "$incoming_totp_key" ] && ! is_valid_encryption_key "$incoming_totp_key"; then
              echo "GitHub Environment secret TOTP_ENCRYPTION_KEY must be exactly 64 hexadecimal characters."
              exit 1
            fi

            server_totp_key=$(awk -F= '
              $1 == "TOTP_ENCRYPTION_KEY" {
                value = substr($0, index($0, "=") + 1)
              }
              END { print value }
            ' .env | tr -d '\r')

            if [ -n "$server_totp_key" ]; then
              if ! is_valid_encryption_key "$server_totp_key"; then
                echo "Server .env contains an invalid TOTP_ENCRYPTION_KEY; refusing to overwrite it automatically."
                exit 1
              fi
              if [ -n "$incoming_totp_key" ]; then
                normalized_server_key=$(printf '%s' "$server_totp_key" | tr '[:upper:]' '[:lower:]')
                normalized_incoming_key=$(printf '%s' "$incoming_totp_key" | tr '[:upper:]' '[:lower:]')
                if [ "$normalized_server_key" != "$normalized_incoming_key" ]; then
                  echo "GitHub TOTP_ENCRYPTION_KEY differs from the server key; refusing unsafe key rotation."
                  exit 1
                fi
              fi
              effective_totp_key="$server_totp_key"
            else
              if [ -z "$incoming_totp_key" ]; then
                echo "TOTP_ENCRYPTION_KEY is missing. Add it to the selected GitHub Environment secrets."
                exit 1
              fi

              effective_totp_key="$incoming_totp_key"
              umask 077
              env_tmp=".env.tmp.$$"
              awk -v key="$effective_totp_key" '
                BEGIN { written = 0 }
                /^TOTP_ENCRYPTION_KEY=/ {
                  if (!written) {
                    print "TOTP_ENCRYPTION_KEY=" key
                    written = 1
                  }
                  next
                }
                { print }
                END {
                  if (!written) print "TOTP_ENCRYPTION_KEY=" key
                }
              ' .env > "$env_tmp"
              chmod 600 "$env_tmp"
              mv "$env_tmp" .env
              echo "Persisted TOTP_ENCRYPTION_KEY to the server .env."
            fi
            chmod 600 .env

            IMAGE_TAG="${RAW_IMAGE_TAG#v}"
            REPOSITORY_OWNER_LOWER=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/${REPOSITORY_OWNER_LOWER}/sub2api:${IMAGE_TAG}"

            if [ -n "$GHCR_USERNAME" ] && [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            fi

            export IMAGE
            docker compose -f "$COMPOSE_FILE" pull
            docker compose -f "$COMPOSE_FILE" up -d

            end_time=$(( $(date +%s) + WAIT_SECONDS ))
            while true; do
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' sub2api 2>/dev/null || true)
              if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                break
              fi

              if [ "$(date +%s)" -ge "$end_time" ]; then
                echo "sub2api failed to become healthy, last status: ${status}"
                docker compose -f "$COMPOSE_FILE" ps
                docker compose -f "$COMPOSE_FILE" logs --tail 100 sub2api
                exit 1
              fi

              sleep 5
            done

            runtime_totp_key=$(docker inspect sub2api --format='{{range .Config.Env}}{{println .}}{{end}}' \
              | awk -F= '$1 == "TOTP_ENCRYPTION_KEY" { value = substr($0, index($0, "=") + 1) } END { print value }' \
              | tr -d '\r')
            if ! is_valid_encryption_key "$runtime_totp_key"; then
              echo "Deployed container does not have a valid TOTP_ENCRYPTION_KEY."
              exit 1
            fi
            normalized_runtime_key=$(printf '%s' "$runtime_totp_key" | tr '[:upper:]' '[:lower:]')
            normalized_effective_key=$(printf '%s' "$effective_totp_key" | tr '[:upper:]' '[:lower:]')
            if [ "$normalized_runtime_key" != "$normalized_effective_key" ]; then
              echo "Deployed container loaded an unexpected TOTP_ENCRYPTION_KEY."
              exit 1
            fi

            echo "Deployed image: $IMAGE"
            echo "Payment resume signing key verified."
            docker compose -f "$COMPOSE_FILE" ps
